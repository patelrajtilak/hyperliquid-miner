<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HYPE Admin</title>
  <style>
    :root { --bg:#070b14; --card:#0f1624; --cyan:#00e8f0; --text:#e8f4ff; --muted:#7a8fa6; --ok:#00c853; --bad:#ff5252; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: Inter, system-ui, sans-serif; background:var(--bg); color:var(--text); padding:20px; max-width:980px; margin:0 auto; }
    h1 { color:var(--cyan); margin-bottom:8px; font-size:22px; }
    h3 { margin-bottom:12px; font-size:15px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid rgba(0,232,240,.12); border-radius:14px; padding:18px; margin-bottom:14px; }
    input, select, button, textarea { padding:10px 12px; border-radius:10px; border:1px solid rgba(0,232,240,.2); background:#0a1018; color:var(--text); margin:4px 0; font-size:13px; }
    button { background:linear-gradient(135deg,var(--cyan),#0088aa); color:#001; font-weight:700; cursor:pointer; border:none; }
    button.ghost { background:transparent; color:var(--cyan); border:1px solid rgba(0,232,240,.3); }
    button.bad { background:transparent; color:var(--bad); border:1px solid rgba(255,82,82,.4); }
    button.ok { background:transparent; color:var(--ok); border:1px solid rgba(0,200,83,.4); }
    label { display:block; font-size:11px; color:var(--muted); margin-top:8px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media(max-width:640px){ .grid{grid-template-columns:1fr;} }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { padding:8px 6px; text-align:left; border-bottom:1px solid rgba(255,255,255,.06); }
    .hidden { display:none; }
    #msg { margin:10px 0; padding:10px; border-radius:10px; font-size:13px; }
    .okmsg { background:rgba(0,200,83,.12); color:#a8ffc8; }
    .errmsg { background:rgba(255,82,82,.12); color:#ffb4b4; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .tabs button { opacity:.7; }
    .tabs button.active { opacity:1; box-shadow:0 0 12px rgba(0,232,240,.3); }
    .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .stat { background:#0a1018; border-radius:10px; padding:12px; text-align:center; }
    .stat b { display:block; color:var(--cyan); font-size:18px; }
    .stat span { font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
  <h1>HYPE MINER · Admin</h1>
  <p class="sub">Manage mining, swap rates, USDT deposits & withdrawals</p>

  <div id="login-card" class="card">
    <h3>Admin Login</h3>
    <label>Username</label>
    <input id="user" value="admin" />
    <label>Password</label>
    <input id="pass" type="password" />
    <br><br>
    <button onclick="login()">Sign in</button>
  </div>

  <div id="panel" class="hidden">
    <div class="tabs">
      <button class="active" data-tab="dash" onclick="tab('dash')">Dashboard</button>
      <button data-tab="settings" onclick="tab('settings')">Settings</button>
      <button data-tab="deposits" onclick="tab('deposits')">Deposits</button>
      <button data-tab="withdrawals" onclick="tab('withdrawals')">Withdrawals</button>
      <button data-tab="users" onclick="tab('users')">Users</button>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>

    <div id="tab-dash" class="card">
      <h3>Network</h3>
      <div class="stat-row" id="stats">—</div>
    </div>

    <div id="tab-settings" class="card hidden">
      <h3>Settings</h3>
      <p class="sub">USDT deposit address = aapka real receive address. Confirm deposits manually.</p>
      <div id="settings-form" class="grid"></div>
      <br>
      <button onclick="saveSettings()">Save all settings</button>
    </div>

    <div id="tab-deposits" class="card hidden">
      <h3>USDT Deposits</h3>
      <div id="deposits-list">Loading…</div>
    </div>

    <div id="tab-withdrawals" class="card hidden">
      <h3>Withdrawal requests</h3>
      <div id="withdrawals-list">Loading…</div>
    </div>

    <div id="tab-users" class="card hidden">
      <h3>Users</h3>
      <div id="users-list">Loading…</div>
    </div>
  </div>

  <div id="msg"></div>

  <script>
    let token = localStorage.getItem('hype_admin_token');
    const msg = (t, ok) => { const e = document.getElementById('msg'); e.textContent = t; e.className = ok ? 'okmsg' : 'errmsg'; setTimeout(()=>e.textContent='',4000); };

    async function api(path, opts = {}) {
      const r = await fetch('/api/admin' + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers||{}) },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Error');
      return d;
    }

    async function login() {
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pass').value })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        token = d.token;
        localStorage.setItem('hype_admin_token', token);
        showPanel();
      } catch (e) { msg(e.message, false); }
    }

    function logout() {
      token = null; localStorage.removeItem('hype_admin_token');
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');
    }

    function tab(name) {
      document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      ['dash','settings','deposits','withdrawals','users'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
      });
      if (name === 'deposits') loadDeposits();
      if (name === 'withdrawals') loadWithdrawals();
      if (name === 'users') loadUsers();
      if (name === 'settings') loadSettings();
      if (name === 'dash') loadStats();
    }

    async function showPanel() {
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      await loadStats();
      await loadSettings();
    }

    async function loadStats() {
      try {
        const s = await api('/stats');
        document.getElementById('stats').innerHTML = `
          <div class="stat"><b>${s.users}</b><span>Users</span></div>
          <div class="stat"><b>${s.totalMined}</b><span>Total mined</span></div>
          <div class="stat"><b>${s.totalBalance}</b><span>Balances</span></div>
          <div class="stat"><b>${s.pendingWithdrawals}</b><span>Pending WD</span></div>`;
      } catch (e) { msg(e.message, false); }
    }

    const SETTING_LABELS = {
      mining_rate: 'Mining rate (HYPE/tap)',
      mine_cooldown_seconds: 'Cooldown (sec)',
      energy_cost_per_mine: 'Energy per mine',
      energy_regen_per_hour: 'Energy regen / hour',
      daily_mine_limit: 'Daily mine limit',
      min_hype_swap: 'Min HYPE to swap',
      hype_to_ton_rate: 'HYPE → TON rate',
      hype_to_gram_rate: 'HYPE → GRAM rate',
      min_usdt_deposit: 'Min USDT for withdraw unlock (0.5)',
      usdt_deposit_address: 'USDT treasury address (BEP20/TRC20)',
      usdt_deposit_network: 'USDT network (BEP20/TRC20)',
      treasury_wallet: 'TON treasury address (for 0.1 TON verify)',
      ton_verify_amount: 'TON verify amount (0.1)',
      ton_verify_enabled: 'TON verify open (true/false)',
      min_withdraw: 'Min HYPE withdraw',
      withdrawals_enabled: 'Withdrawals open (true/false)',
      swap_enabled: 'Swap open (true/false)',
      deposit_enabled: 'USDT deposits open (true/false)',
      referral_bonus: 'Referral bonus HYPE',
      referral_commission_pct: 'Referral commission %',
      target_cap: 'Pool target cap',
      token_symbol: 'Token symbol',
      app_name: 'App name'
    };

    async function loadSettings() {
      try {
        const { settings } = await api('/settings');
        const form = document.getElementById('settings-form');
        const keys = Object.keys(SETTING_LABELS);
        form.innerHTML = keys.map(k => {
          const v = settings[k] != null ? settings[k] : '';
          return `<div><label>${SETTING_LABELS[k]}</label><input data-key="${k}" value="${String(v).replace(/"/g,'&quot;')}" /></div>`;
        }).join('');
      } catch (e) { msg(e.message, false); }
    }

    async function saveSettings() {
      const updates = {};
      document.querySelectorAll('#settings-form input').forEach(i => { updates[i.dataset.key] = i.value; });
      try {
        await api('/settings', { method: 'PUT', body: updates });
        msg('Settings saved', true);
      } catch (e) { msg(e.message, false); }
    }

    async function loadDeposits() {
      try {
        const { deposits } = await api('/deposits?status=pending');
        const el = document.getElementById('deposits-list');
        if (!deposits.length) { el.innerHTML = '<p class="sub">No pending deposits</p>'; return; }
        el.innerHTML = `<table><tr><th>ID</th><th>User</th><th>Asset</th><th>Amount</th><th>Purpose</th><th>Tx</th><th>Time</th><th></th></tr>
          ${deposits.map(d => `<tr>
            <td>${d.id}</td>
            <td>${d.username || d.first_name || d.telegram_id || d.user_id}</td>
            <td>${d.asset || 'USDT'}</td>
            <td>${d.amount}</td>
            <td>${d.purpose || (d.asset === 'TON' ? 'verify' : 'unlock')}</td>
            <td style="max-width:90px;overflow:hidden;text-overflow:ellipsis">${d.tx_hash || '—'}</td>
            <td>${(d.created_at||'').slice(0,16)}</td>
            <td>
              <button class="ok" onclick="confirmDep(${d.id})">Confirm</button>
              <button class="bad" onclick="rejectDep(${d.id})">Reject</button>
            </td>
          </tr>`).join('')}</table>`;
      } catch (e) { msg(e.message, false); }
    }

    async function confirmDep(id) {
      try {
        await api('/deposits/' + id, { method: 'PATCH', body: { status: 'confirmed' } });
        msg('Deposit confirmed — user unlocked', true);
        loadDeposits();
      } catch (e) { msg(e.message, false); }
    }
    async function rejectDep(id) {
      try {
        await api('/deposits/' + id, { method: 'PATCH', body: { status: 'rejected' } });
        msg('Deposit rejected', true);
        loadDeposits();
      } catch (e) { msg(e.message, false); }
    }

    async function loadWithdrawals() {
      try {
        const { withdrawals } = await api('/withdrawals?status=pending');
        const el = document.getElementById('withdrawals-list');
        if (!withdrawals.length) { el.innerHTML = '<p class="sub">No pending withdrawals</p>'; return; }
        el.innerHTML = `<table><tr><th>ID</th><th>User</th><th>Amount</th><th>Wallet</th><th></th></tr>
          ${withdrawals.map(w => `<tr>
            <td>${w.id}</td>
            <td>${w.username || w.first_name || w.user_id}</td>
            <td>${w.amount} ${w.asset || 'HYPE'}</td>
            <td style="font-size:11px">${(w.wallet_address||'').slice(0,12)}…</td>
            <td>
              <button class="ok" onclick="wd(${w.id},'completed')">Paid</button>
              <button class="bad" onclick="wd(${w.id},'rejected')">Reject</button>
            </td>
          </tr>`).join('')}</table>`;
      } catch (e) { msg(e.message, false); }
    }

    async function wd(id, status) {
      const txHash = status === 'completed' ? prompt('Tx hash (optional)') : null;
      try {
        await api('/withdrawals/' + id, { method: 'PATCH', body: { status, txHash } });
        msg('Updated', true);
        loadWithdrawals();
      } catch (e) { msg(e.message, false); }
    }

    async function loadUsers() {
      try {
        const { users } = await api('/users?limit=30');
        document.getElementById('users-list').innerHTML = `<table>
          <tr><th>ID</th><th>Name</th><th>HYPE</th><th>Mined</th><th>Ban</th></tr>
          ${users.map(u => `<tr>
            <td>${u.id}</td><td>${u.username||u.first_name||u.telegram_id}</td>
            <td>${u.balance}</td><td>${u.total_mined}</td><td>${u.is_banned?'YES':'no'}</td>
          </tr>`).join('')}</table>`;
      } catch (e) { msg(e.message, false); }
    }

    if (token) showPanel().catch(() => logout());
  </script>
</body>
</html>
