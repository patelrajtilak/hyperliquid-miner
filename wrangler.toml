name = "hyperliquid-miner"
main = "server/cf-worker.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Frontend static files
[assets]
directory = "./public"
binding = "ASSETS"

# KV — Cloudflare Dashboard → Workers → hyperliquid-miner → Bindings
# se HYPE_DB id copy karke yahan daalo (REPLACE text mat chhodo)
[[kv_namespaces]]
binding = "HYPE_DB"
id = "ed2fc4881763493686c6992b16a6a28b"
preview_id = "c0d8754741734071880b65d200c84d5e"

[triggers]
crons = ["*/5 * * * *"]
