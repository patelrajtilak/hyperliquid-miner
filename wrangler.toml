name = "hyperliquid-miner"
main = "server/cf-worker.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Serve the public/ frontend as static assets
[assets]
directory = "./public"
binding = "ASSETS"

# KV for persistent JSON store (create with: npx wrangler kv namespace create HYPE_DB)
[[kv_namespaces]]
binding = "HYPE_DB"
id = "ed2fc4881763493686c6992b16a6a28b"
preview_id = "c0d8754741734071880b65d200c84d5e"

# Optional Cron for mining-pause notifications (every 5 min)
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set via: npx wrangler secret put BOT_TOKEN)
# BOT_TOKEN, JWT_SECRET, ADMIN_PASSWORD, REFERRAL_SALT, WEBAPP_URL, COMMUNITY_CHANNEL_URL
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = true
persist = true
